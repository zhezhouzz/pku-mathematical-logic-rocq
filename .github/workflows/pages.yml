name: Build and publish the executable textbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zhouzhe956/pku-mathematical-logic-rocq:rocq-9.1.1
      # GitHub mounts runner command files as root-owned paths.  The image
      # remains non-root for students, but container actions need to write
      # those paths before any project command is run.
      options: --user root
      env:
        OPAMROOT: /home/rocq/.opam
        OPAMROOTISOK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Compile the book
        run: make book
      - name: Build and check HTML
        run: make html-check
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: executable-textbook
          path: _site
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
